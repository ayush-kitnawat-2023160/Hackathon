services:
  api:
    build: .
    env_file: [.env]
    environment:
      DB_PATH: /data/allocator.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434   # Ollama runs on the host if LLM_PROVIDER=ollama
    volumes:
      - dbdata:/data
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    # load the sample pack on first start (judges load their own data via POST /ingest or the CLI loader)
    command: >
      sh -c "[ -f /data/allocator.db ] || python -m app.data.load --dir data/sample;
             uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

  ui:
    build: .
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false

volumes:
  dbdata:
